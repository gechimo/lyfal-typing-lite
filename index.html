<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>刑事訴訟法タイピング</title>
    <style>
        body { font-family: sans-serif; text-align: center; background: #f0f2f5; padding: 20px; }
        #game-container { max-width: 600px; margin: auto; background: white; padding: 30px; border-radius: 15px; }
        #word { font-size: 32px; font-weight: bold; margin: 20px 0; color: #1a73e8; }
        #reading { font-size: 18px; color: #5f6368; height: 24px; }
        #roma { font-size: 20px; color: #202124; margin-bottom: 20px; height: 24px; }
        #input-field { font-size: 24px; padding: 10px; width: 80%; }
        .stats { margin-top: 20px; font-weight: bold; }
        .screen { display: none; }
        .active { display: block; }
        button { font-size: 18px; padding: 10px 20px; cursor: pointer; margin: 5px; }
    </style>
</head>
<body>

<div id="game-container">
    <h1>法学タイピング</h1>

    <div id="difficulty-screen" class="screen active">
        <p>難易度を選択してください</p>
        <button onclick="selectDifficulty('normal')">通常</button>
        <button onclick="selectDifficulty('no-furigana')">ふりがな無し</button>
    </div>

    <div id="time-screen" class="screen">
        <p>制限時間を選択してください</p>
        <button onclick="selectTime(60)">1分モード</button>
        <button onclick="selectTime(180)">3分モード</button>
        <button onclick="selectTime(300)">5分モード</button>
    </div>

    <div id="game-screen" class="screen">
        <div id="word">読み込み中...</div>
        <div id="reading"></div>
        <div id="roma"></div>
        <input type="text" id="input-field" autocomplete="off">
        <div class="stats">
            残り時間: <span id="timer">--</span>秒 | スコア: <span id="score">0</span>
        </div>
    </div>

    <div id="result-screen" class="screen">
        <h2>終了！</h2>
        <p>スコア: <span id="final-score">0</span></p>
        <button onclick="location.reload()">もう一度</button>
    </div>
</div>

<script>
    let terms = [];
    let currentTerm = null;
    let score = 0;
    let timeLeft = 60;
    let timerId = null;
    let difficulty = 'normal';

    async function loadTerms() {
        const response = await fetch('data/terms.json');
        terms = await response.json();
    }

    function selectDifficulty(d) {
        difficulty = d;
        document.getElementById('difficulty-screen').classList.remove('active');
        document.getElementById('time-screen').classList.add('active');
    }

    function selectTime(t) {
        timeLeft = t;
        document.getElementById('time-screen').classList.remove('active');
        document.getElementById('game-screen').classList.add('active');
        startGame();
    }

    function startGame() {
        document.getElementById('input-field').focus();
        nextWord();
        timerId = setInterval(() => {
            timeLeft--;
            document.getElementById('timer').innerText = timeLeft;
            if (timeLeft <= 0) endGame();
        }, 1000);
    }

    function nextWord() {
        if (terms.length === 0) return;
        currentTerm = terms[Math.floor(Math.random() * terms.length)];
        document.getElementById('word').innerText = currentTerm.term;
        
        const readingEl = document.getElementById('reading');
        const romaEl = document.getElementById('roma');
        
        // 以前のロジック：ローマ字は常に出す。ふりがなだけ難易度で切り替える
        romaEl.innerText = currentTerm.roma;
        if (difficulty === 'normal') {
            readingEl.innerText = currentTerm.reading;
        } else {
            readingEl.innerText = '';
        }
        
        document.getElementById('input-field').value = '';
    }

    document.getElementById('input-field').addEventListener('input', (e) => {
        if (e.target.value === currentTerm.roma) {
            score++;
            document.getElementById('score').innerText = score;
            nextWord();
        }
    });

    function endGame() {
        clearInterval(timerId);
        document.getElementById('game-screen').classList.remove('active');
        document.getElementById('result-screen').classList.add('active');
        document.getElementById('final-score').innerText = score;
    }

    loadTerms();
</script>
</body>
</html>
