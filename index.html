<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>刑事訴訟法タイピング</title>
    <style>
        body { font-family: sans-serif; text-align: center; background: #f0f2f5; margin: 0; padding: 20px; }
        #game-container { max-width: 600px; margin: auto; background: white; padding: 30px; border-radius: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        #word { font-size: 32px; font-weight: bold; margin: 20px 0; color: #1a73e8; min-height: 40px; }
        #reading { font-size: 18px; color: #5f6368; margin-bottom: 10px; }
        #roma { font-size: 20px; color: #202124; letter-spacing: 1px; }
        #input-field { font-size: 24px; padding: 10px; width: 80%; border: 2px solid #dadce0; border-radius: 8px; outline: none; }
        #input-field:focus { border-color: #1a73e8; }
        .stats { display: flex; justify-content: space-around; margin-top: 20px; font-weight: bold; }
        .screen { display: none; }
        .active { display: block; }
        button { font-size: 18px; padding: 10px 20px; cursor: pointer; background: #1a73e8; color: white; border: none; border-radius: 5px; margin: 5px; }
        button:hover { background: #1557b0; }
    </style>
</head>
<body>

<div id="game-container">
    <h1>法学タイピング</h1>

    <div id="difficulty-screen" class="screen active">
        <p>難易度（スピード）を選択してください</p>
        <button onclick="selectDifficulty(3000)">かんたん</button>
        <button onclick="selectDifficulty(2000)">ふつう</button>
        <button onclick="selectDifficulty(1500)">むずかしい</button>
    </div>

    <div id="time-screen" class="screen">
        <p>制限時間を選択してください</p>
        <button onclick="selectTime(60)">1分モード</button>
        <button onclick="selectTime(180)">3分モード</button>
        <button onclick="selectTime(300)">5分モード</button>
    </div>

    <div id="game-screen" class="screen">
        <div id="word">読み込み中...</div>
        <div id="reading"></div>
        <div id="roma"></div>
        <input type="text" id="input-field" autocomplete="off">
        <div class="stats">
            <div>残り時間: <span id="timer">--</span>秒</div>
            <div>スコア: <span id="score">0</span></div>
        </div>
    </div>

    <div id="result-screen" class="screen">
        <h2>終了！</h2>
        <p>スコア: <span id="final-score">0</span></p>
        <button onclick="location.reload()">もう一度</button>
    </div>
</div>

<script>
    let terms = [];
    let currentTerm = null;
    let score = 0;
    let timeLeft = 60;
    let speed = 2000;
    let timerId = null;

    async function loadTerms() {
        const response = await fetch('data/terms.json');
        terms = await response.json();
    }

    function selectDifficulty(s) {
        speed = s;
        document.getElementById('difficulty-screen').classList.remove('active');
        document.getElementById('time-screen').classList.add('active');
    }

    function selectTime(t) {
        timeLeft = t;
        document.getElementById('time-screen').classList.remove('active');
        document.getElementById('game-screen').classList.add('active');
        startGame();
    }

    function startGame() {
        score = 0;
        document.getElementById('score').innerText = score;
        document.getElementById('input-field').focus();
        nextWord();
        timerId = setInterval(updateTimer, 1000);
    }

    function updateTimer() {
        timeLeft--;
        document.getElementById('timer').innerText = timeLeft;
        if (timeLeft <= 0) {
            endGame();
        }
    }

    function nextWord() {
        currentTerm = terms[Math.floor(Math.random() * terms.length)];
        document.getElementById('word').innerText = currentTerm.term;
        document.getElementById('reading').innerText = currentTerm.reading;
        document.getElementById('roma').innerText = currentTerm.roma;
        document.getElementById('input-field').value = '';
    }

    document.getElementById('input-field').addEventListener('input', (e) => {
        if (e.target.value === currentTerm.roma) {
            score++;
            document.getElementById('score').innerText = score;
            nextWord();
        }
    });

    function endGame() {
        clearInterval(timerId);
        document.getElementById('game-screen').classList.remove('active');
        document.getElementById('result-screen').classList.add('active');
        document.getElementById('final-score').innerText = score;
    }

    loadTerms();
</script>
</body>
</html>
